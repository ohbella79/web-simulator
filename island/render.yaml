# Render Blueprint — IslandResilience AI (Phase 1 demo)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: islandresilience-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/meta
    envVars:
      - key: NODE_VERSION
        value: "22"
    # ── 데이터 영속화(선택 · 유료 인스턴스) ──────────────────
    # 디스크를 추가하고(DB 유지) 싶을 때 아래 주석을 해제하세요.
    # disk:
    #   name: island-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # 그리고 위 envVars 목록에 다음을 추가:
    #   - key: DB_PATH
    #     value: /var/data/island.db
